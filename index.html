<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Viacolor Mobile UI</title><style>body{margin:0;font-family:system-ui;background:#eef2f7;display:flex;justify-content:center;padding:18px}.phone{width:390px;max-width:100%;background:#fff;border-radius:36px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.18)}.screen{background:#081018;color:#55ff88;border-radius:22px;padding:18px;text-align:center;font-family:monospace}.big{font-size:42px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:700;background:#1e40af;color:#fff}.sec{background:#334155}.setup{margin-top:16px;padding:12px;border-radius:18px;background:#f8fafc}</style></head><body><div class='phone'><div class='screen'><div class='big' id='status'>A+30</div><div id='hz'>432 Hz</div><div id='audio'>AUDIO OFF</div><div id='visual'>VISUAL PULSE</div></div><div class='grid'><button id='ag'>A</button><button id='plus'>+30</button><button id='minus' class='sec'>-</button><button id='vis'>Visual</button><button id='aud'>Audio</button><button id='car'>432</button></div><div class='setup'><b>Setup</b><br>Perfil: Cell / Tablet / PC<br>☑ Bloquear flash fuerte<br>☐ Modo avión<br>☐ Permitir modo experto (-20)</div></div><script>let A=['A','B','C','D','E','F','G'],i=0,p=['0','+10','+20','+30'],pi=3;ag.onclick=()=>{i=(i+1)%A.length;ag.textContent=A[i];status.textContent=A[i]+p[pi]};plus.onclick=()=>{pi=(pi+1)%p.length;plus.textContent=p[pi];status.textContent=A[i]+p[pi]};minus.onclick=()=>{status.textContent=A[i]+'-30'};let v=['PULSE','SINE','SOLID','FLASH'],vi=0;vis.onclick=()=>{vi=(vi+1)%v.length;visual.textContent='VISUAL '+v[vi]};let au=['OFF','AM','ISO'],ai=0;aud.onclick=()=>{ai=(ai+1)%au.length;audio.textContent='AUDIO '+au[ai]};let hzv=['432','528','741','963','1000'],hi=0;car.onclick=()=>{hi=(hi+1)%hzv.length;car.textContent=hzv[hi];hz.textContent=hzv[hi]+' Hz'};</script></body></html>
